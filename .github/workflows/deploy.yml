name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.VITE_TELEGRAM_ADMIN_CHAT_ID }}
          VITE_TELEGRAM_GUEST_CHANNEL_ID: ${{ secrets.VITE_TELEGRAM_GUEST_CHANNEL_ID }}
          VITE_TELEGRAM_CHANNEL_URL: ${{ secrets.VITE_TELEGRAM_CHANNEL_URL }}
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
